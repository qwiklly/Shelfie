name: iOS build

# Builds an unsigned Shelfie.ipa on a macOS runner. It can be installed on an iPhone with
# Sideloadly or AltStore, which sign it with your own Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [ios-build]

jobs:
  ios:
    name: Unsigned iOS app (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The project also targets Android and Mac Catalyst, and restore needs all of their workloads.
      - name: Install the MAUI workloads the project needs
        run: dotnet workload restore MauiApp1/MauiApp1.csproj

      - name: Build the app for iPhone (no code signing)
        run: |
          set +e
          dotnet build MauiApp1/MauiApp1.csproj -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          # Surface the build errors as annotations so they show up on the run page.
          grep -E ": error |error MT|error :|clang: error|ld: " build.log | sort -u | head -10 | while read -r line; do echo "::error::$line"; done
          exit $code

      - name: Pack into an .ipa
        run: |
          APP=$(find MauiApp1/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Shelfie-unsigned.ipa Payload)
          ls -lh Shelfie-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shelfie-ios
          path: Shelfie-unsigned.ipa
          if-no-files-found: error
