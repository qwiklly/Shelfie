name: iOS build

# Builds an unsigned Shelfie.ipa on a macOS runner. It can be installed on an iPhone with
# Sideloadly or AltStore, which sign it with your own Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [ios-build]

jobs:
  ios:
    name: Unsigned iOS app (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          echo "::notice::Xcodes on the runner: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          # Newest *complete* Xcode 26.x (the pinned iOS packs below are made for it):
          # some preinstalled Xcodes miss the SDKs.
          XCODE=""
          for x in $(ls -d /Applications/Xcode_26*.app | sort -rV); do
            dev="$x/Contents/Developer"
            if [ -d "$dev/Platforms/iPhoneOS.platform/Developer/SDKs" ] && [ -d "$dev/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              XCODE="$x"; break
            fi
          done
          if [ -z "$XCODE" ]; then echo "::error::No complete Xcode 26 found"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch || true
          echo "::notice::Using $(basename "$XCODE"): $(xcodebuild -version | tr '\n' ' '), iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The project also targets Android and Mac Catalyst, and restore needs all of their workloads.
      # iOS / Mac Catalyst are pinned to 26.5 (built for Xcode 26.x): the newest packs require an Xcode
      # that the runner may not have yet.
      - name: Install the MAUI workloads the project needs
        run: |
          cat > rollback.json <<'JSON'
          {
            "microsoft.net.sdk.ios": "26.5.10301/10.0.100",
            "microsoft.net.sdk.maccatalyst": "26.5.10301/10.0.100"
          }
          JSON
          dotnet workload install maui-ios maui-maccatalyst maui-android --from-rollback-file rollback.json
          dotnet workload list

      - name: Build the app for iPhone (no code signing)
        run: |
          set +e
          dotnet build MauiApp1/MauiApp1.csproj -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          # Surface the build errors as annotations so they show up on the run page.
          grep -E ": error |error MT|error :|clang: error|ld: " build.log | sort -u | head -10 | while read -r line; do echo "::error::$line"; done
          exit $code

      - name: Pack into an .ipa
        run: |
          APP=$(find MauiApp1/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Shelfie-unsigned.ipa Payload)
          ls -lh Shelfie-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shelfie-ios
          path: Shelfie-unsigned.ipa
          if-no-files-found: error
