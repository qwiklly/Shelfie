<svg width="133" height="133" viewBox="0 0 133 133" xmlns="http://www.w3.org/2000/svg">
<!-- Launcher icon background: full-bleed gradient, the OS applies its own mask (circle, squircle…). -->
<rect width="133" height="133" fill="url(#bg)"/>
<defs>
<linearGradient id="bg" x1="66.5" y1="0" x2="66.5" y2="133" gradientUnits="userSpaceOnUse">
<stop stop-color="#1C7B59"/>
<stop offset="1" stop-color="#0D9331"/>
</linearGradient>
</defs>
</svg>
