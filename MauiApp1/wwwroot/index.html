<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Shelfie</title>
    <base href="/" />
    <!-- Everything is bundled with the app: the UI must work without internet. -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="MauiApp1.styles.css" />
    <link rel="icon" type="image/png" href="images/shelfie-logo.png" />
</head>

<body>
    <div id="app"><div class="boot-splash"><img src="images/shelfie-logo.png" alt="" /></div></div>

    <div id="blazor-error-ui">
        Произошла ошибка. / An unhandled error has occurred.
        <a href="" class="reload">↻</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.shelfieScrollTop = function () { window.scrollTo(0, 0); };
        // Correct hyphenation (hyphens: auto) needs the document language.
        window.shelfieSetLang = function (lang) { document.documentElement.lang = lang; };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
